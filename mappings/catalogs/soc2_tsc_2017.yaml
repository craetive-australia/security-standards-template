controls:
  # Common Criteria: Control Environment
  - id: "CC1.1"
    title: "Commitment to Integrity and Ethical Values"
    category: "CC"
    description: "The entity demonstrates a commitment to integrity and ethical values."
  - id: "CC1.2"
    title: "Independent Board Oversight"
    category: "CC"
    description: "The board of directors demonstrates independence from management and exercises oversight of the development and performance of internal control."
  - id: "CC1.3"
    title: "Management Structures, Reporting Lines, and Authorities"
    category: "CC"
    description: "Management establishes, with board oversight, structures, reporting lines, and appropriate authorities and responsibilities in the pursuit of objectives."
  - id: "CC1.4"
    title: "Commitment to Competence"
    category: "CC"
    description: "The entity demonstrates a commitment to attract, develop, and retain competent individuals in alignment with objectives."
  - id: "CC1.5"
    title: "Accountability for Internal Control Responsibilities"
    category: "CC"
    description: "The entity holds individuals accountable for their internal control responsibilities in the pursuit of objectives."

  # Common Criteria: Communication and Information
  - id: "CC2.1"
    title: "Use of Relevant, Quality Information"
    category: "CC"
    description: "The entity obtains or generates and uses relevant, quality information to support the functioning of internal control."
  - id: "CC2.2"
    title: "Internal Communication of Objectives and Responsibilities"
    category: "CC"
    description: "The entity internally communicates information, including objectives and responsibilities for internal control, necessary to support the functioning of internal control."
  - id: "CC2.3"
    title: "External Communication Regarding Internal Control"
    category: "CC"
    description: "The entity communicates with external parties regarding matters affecting the functioning of internal control."

  # Common Criteria: Risk Assessment
  - id: "CC3.1"
    title: "Specification of Suitable Objectives"
    category: "CC"
    description: "The entity specifies objectives with sufficient clarity to enable the identification and assessment of risks relating to objectives."
  - id: "CC3.2"
    title: "Identification and Assessment of Risks"
    category: "CC"
    description: "The entity identifies risks to the achievement of its objectives across the entity and analyzes risks as a basis for determining how the risks should be managed."
  - id: "CC3.3"
    title: "Consideration of Potential for Fraud"
    category: "CC"
    description: "The entity considers the potential for fraud in assessing risks to the achievement of objectives."
  - id: "CC3.4"
    title: "Identification and Assessment of Significant Changes"
    category: "CC"
    description: "The entity identifies and assesses changes that could significantly affect the system of internal control."

  # Common Criteria: Monitoring Activities
  - id: "CC4.1"
    title: "Ongoing and Separate Evaluations"
    category: "CC"
    description: "The entity selects, develops, and performs ongoing and/or separate evaluations to ascertain whether the components of internal control are present and functioning."
  - id: "CC4.2"
    title: "Evaluation and Communication of Deficiencies"
    category: "CC"
    description: "The entity evaluates and communicates internal control deficiencies in a timely manner to those parties responsible for taking corrective action, including senior management and the board of directors, as appropriate."

  # Common Criteria: Control Activities
  - id: "CC5.1"
    title: "Selection and Development of Control Activities"
    category: "CC"
    description: "The entity selects and develops control activities that contribute to the mitigation of risks to the achievement of objectives to acceptable levels."
  - id: "CC5.2"
    title: "Selection and Development of General Controls over Technology"
    category: "CC"
    description: "The entity also selects and develops general control activities over technology to support the achievement of objectives."
  - id: "CC5.3"
    title: "Deployment of Control Activities through Policies and Procedures"
    category: "CC"
    description: "The entity deploys control activities through policies that establish what is expected and procedures that put policies into action."

  # Common Criteria: Logical and Physical Access Controls
  - id: "CC6.1"
    title: "Logical Access Security Software and Infrastructure"
    category: "CC"
    description: "The entity implements logical access security software, infrastructure, and architectures over protected information assets to protect them from security events to meet the entity's objectives."
  - id: "CC6.2"
    title: "User Registration, Modification, and De-registration"
    category: "CC"
    description: "Prior to issuing system credentials and granting system access, the entity registers and authorizes new internal and external users whose access is administered by the entity. The entity removes user access when access is no longer required."
  - id: "CC6.3"
    title: "Role-Based Access and Least Privilege"
    category: "CC"
    description: "The entity authorizes, modifies, or removes access to data, software, functions, and other protected information assets based on roles, responsibilities, or the normal request and approval process."
  - id: "CC6.4"
    title: "Physical Access Restrictions and Environmental Protection"
    category: "CC"
    description: "The entity restricts physical access to facilities and protected information assets (for example, data center facilities, back-up media storage, and other sensitive locations) to authorized personnel to meet the entity's objectives."
  - id: "CC6.5"
    title: "Secure Disposal and Asset Management"
    category: "CC"
    description: "The entity discontinues logical and physical protections over physical assets only after the ability to read or recover data and software from those assets has been diminished and is no longer capable of being reconstructed."
  - id: "CC6.6"
    title: "Perimeter Security, Boundary Protection, and Network Segmentation"
    category: "CC"
    description: "The entity implements logical boundaries and boundary protection systems to protect protected information assets from security events to meet the entity's objectives."
  - id: "CC6.7"
    title: "Transmission Security and Cryptographic Protection"
    category: "CC"
    description: "The entity restricts the transmission, movement, and removal of information to authorized internal and external users and processes, and protects it during transmission, movement, or removal to meet the entity's objectives."
  - id: "CC6.8"
    title: "Prevention and Detection of Malicious Code"
    category: "CC"
    description: "The entity implements controls to prevent or detect and act upon the introduction of unauthorized or malicious software to meet the entity's objectives."

  # Common Criteria: System Operations
  - id: "CC7.1"
    title: "Vulnerability Management and Detection Infrastructure"
    category: "CC"
    description: "To meet its objectives, the entity uses detection and monitoring procedures to identify (1) changes to configurations that result in the introduction of new vulnerabilities, and (2) susceptibilities to newly discovered vulnerabilities."
  - id: "CC7.2"
    title: "System Monitoring, Logging, and Anomaly Detection"
    category: "CC"
    description: "The entity monitors system components and the operation of those components for anomalies that are indicative of malicious acts, natural disasters, and technical failures affecting the entity's ability to meet its objectives."
  - id: "CC7.3"
    title: "Security Incident Evaluation and Response"
    category: "CC"
    description: "The entity evaluates security events to determine whether they could or have resulted in a failure of the entity to meet its objectives (security incidents) and, if so, takes actions to prevent or address such failures."
  - id: "CC7.4"
    title: "Incident Containment, Remediation, and Communication"
    category: "CC"
    description: "The entity responds to identified security incidents by executing a defined incident response program to understand, contain, remediate, and communicate security incidents, as appropriate."
  - id: "CC7.5"
    title: "Business Continuity, Disaster Recovery, and Failover"
    category: "CC"
    description: "The entity identifies, develops, and implements activities to recover from security events to meet the entity's objectives."

  # Common Criteria: Change Management
  - id: "CC8.1"
    title: "Authorization, Testing, and Approval of System Changes"
    category: "CC"
    description: "The entity authorizes, designs, develops or acquires, configures, documents, tests, approves, and implements changes to infrastructure, data, software, and procedures to meet its objectives."

  # Common Criteria: Risk Mitigation
  - id: "CC9.1"
    title: "Mitigation of Business Disruption Risks"
    category: "CC"
    description: "The entity identifies, selects, and develops risk mitigation activities for risks arising from potential business disruptions."
  - id: "CC9.2"
    title: "Vendor and Third-Party Risk Management"
    category: "CC"
    description: "The entity assesses and manages risks associated with vendors and business partners."

  # Availability Criteria
  - id: "A1.1"
    title: "Capacity Management and System Forecasting"
    category: "A"
    description: "The entity maintains, monitors, and evaluates current processing capacity and use of system components to manage capacity demand and to enable the implementation of additional capacity to help meet its objectives."
  - id: "A1.2"
    title: "Environmental Protection and Infrastructure Redundancy"
    category: "A"
    description: "The entity authorizes, designs, develops or acquires, implements, operates, approves, maintains, and monitors environmental protections, software, data backup processes, and recovery infrastructure to meet its objectives."
  - id: "A1.3"
    title: "Data Backup and Business Continuity Testing"
    category: "A"
    description: "The entity tests recovery plan procedures supporting system recovery to meet its objectives."

  # Confidentiality Criteria
  - id: "C1.1"
    title: "Identification and Protection of Confidential Information"
    category: "C"
    description: "The entity identifies and maintains confidential information to meet the entity's objectives related to confidentiality."
  - id: "C1.2"
    title: "Disposal of Confidential Information"
    category: "C"
    description: "The entity disposes of confidential information to meet the entity's objectives related to confidentiality."

  # Processing Integrity Criteria
  - id: "PI1.1"
    title: "Processing Integrity Policies and System Specifications"
    category: "PI"
    description: "The entity obtains or generates, uses, and communicates relevant, quality information regarding the objectives related to processing, including definitions of data processed and system specifications."
  - id: "PI1.2"
    title: "Input Validation and Data Authorization"
    category: "PI"
    description: "The entity implements policies and procedures over system inputs, including controls over the completeness, accuracy, and authorization of inputs to meet its objectives."
  - id: "PI1.3"
    title: "Data Processing Accuracy and Completeness"
    category: "PI"
    description: "The entity implements policies and procedures over system processing, including controls over the completeness, accuracy, and timeliness of processing to meet its objectives."
  - id: "PI1.4"
    title: "Output Delivery and Distribution Controls"
    category: "PI"
    description: "The entity implements policies and procedures over system outputs, including controls over the completeness, accuracy, and distribution of outputs to meet its objectives."
  - id: "PI1.5"
    title: "Data Storage and Archiving Integrity"
    category: "PI"
    description: "The entity implements policies and procedures over data storage and archiving, including controls over the completeness and accuracy of stored and archived data to meet its objectives."

  # Privacy Criteria
  - id: "P1.1"
    title: "Privacy Notice and Communication of Objectives"
    category: "P"
    description: "The entity provides notice to data subjects about its privacy practices, including purposes for which personal information is collected, used, retained, and disclosed."
  - id: "P2.1"
    title: "Choice and Consent for Personal Information Processing"
    category: "P"
    description: "The entity communicates choices available regarding the collection, use, retention, disclosure, and disposal of personal information to data subjects."
  - id: "P3.1"
    title: "Personal Information Collection Limitation"
    category: "P"
    description: "Personal information is collected only for the purposes identified in the notice and consistent with the entity's objectives."
  - id: "P3.2"
    title: "Explicit Consent for Sensitive Personal Information"
    category: "P"
    description: "The entity obtains explicit consent from data subjects prior to collecting and processing sensitive personal information."
  - id: "P4.1"
    title: "Use of Personal Information Consistent with Notice"
    category: "P"
    description: "The entity limits the use of personal information to the purposes identified in the notice and for which the individual provided implicit or explicit consent."
  - id: "P4.2"
    title: "Personal Information Retention Schedules"
    category: "P"
    description: "The entity retains personal information only for as long as necessary to fulfill the stated purposes or as required by applicable laws and regulations."
  - id: "P4.3"
    title: "Secure Disposal and Destruction of Personal Information"
    category: "P"
    description: "The entity securely disposes of, erases, or de-identifies personal information when it is no longer required for the stated purposes."
  - id: "P5.1"
    title: "Data Subject Access to Personal Information"
    category: "P"
    description: "The entity provides data subjects with access to their personal information for review and correction."
  - id: "P5.2"
    title: "Correction and Rectification of Personal Information"
    category: "P"
    description: "The entity corrects, amends, or appends personal information when substantiated by the data subject."
  - id: "P6.1"
    title: "Disclosure of Personal Information to Third Parties"
    category: "P"
    description: "The entity discloses personal information to third parties only for the purposes identified in the notice and with the data subject's explicit or implicit consent."
  - id: "P6.2"
    title: "Third-Party Contractual Privacy Commitments"
    category: "P"
    description: "The entity requires third parties receiving personal information to adhere to privacy practices equivalent to those of the entity."
  - id: "P6.3"
    title: "Monitoring Third-Party Privacy Compliance"
    category: "P"
    description: "The entity monitors third-party compliance with contractual privacy obligations and remediates noncompliance."
  - id: "P6.4"
    title: "Prevention of Unauthorized Disclosure"
    category: "P"
    description: "The entity protects personal information against unauthorized disclosure during transit, processing, and storage."
  - id: "P6.5"
    title: "Privacy Breach Notification"
    category: "P"
    description: "The entity provides notification of privacy breaches to affected data subjects, regulators, and other interested parties as required by law."
  - id: "P6.6"
    title: "Accounting of Disclosures"
    category: "P"
    description: "The entity maintains records of disclosures of personal information and provides an accounting to data subjects upon request."
  - id: "P6.7"
    title: "Transborder Data Flows and International Transfers"
    category: "P"
    description: "The entity restricts cross-border transfers of personal information to countries or organizations ensuring adequate protection."
  - id: "P7.1"
    title: "Quality and Accuracy of Personal Information"
    category: "P"
    description: "The entity maintains accurate, complete, and relevant personal information for the purposes identified in the notice."
  - id: "P8.1"
    title: "Monitoring and Enforcement of Privacy Commitments"
    category: "P"
    description: "The entity monitors compliance with its privacy policies and procedures and implements a process for addressing privacy-related complaints and disputes."
