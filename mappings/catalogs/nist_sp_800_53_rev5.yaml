controls:
  # AC - Access Control (16)
  - id: "AC-1"
    title: "Policy and Procedures"
    family: "AC"
    baseline: "Moderate"
    description: "Develop, document, and disseminate access control policy and procedures."
  - id: "AC-2"
    title: "Account Management"
    family: "AC"
    baseline: "Moderate"
    description: "Manage system accounts including establishing, activating, modifying, reviewing, and disabling accounts."
  - id: "AC-3"
    title: "Access Enforcement"
    family: "AC"
    baseline: "Moderate"
    description: "Enforce approved authorizations for logical access to information and system resources."
  - id: "AC-4"
    title: "Information Flow Enforcement"
    family: "AC"
    baseline: "Moderate"
    description: "Enforce approved authorizations for controlling the flow of information within the system and between connected systems."
  - id: "AC-5"
    title: "Separation of Duties"
    family: "AC"
    baseline: "Moderate"
    description: "Separate duties of individuals to prevent unauthorized activity or conflict of interest."
  - id: "AC-6"
    title: "Least Privilege"
    family: "AC"
    baseline: "Moderate"
    description: "Employ the principle of least privilege, allowing only authorized accesses necessary to perform tasks."
  - id: "AC-7"
    title: "Unsuccessful Logon Attempts"
    family: "AC"
    baseline: "Moderate"
    description: "Enforce a limit of consecutive invalid logon attempts and automatically lock the account."
  - id: "AC-8"
    title: "System Use Notification"
    family: "AC"
    baseline: "Moderate"
    description: "Display an approved system use notification message before granting system access."
  - id: "AC-11"
    title: "Device Lock"
    family: "AC"
    baseline: "Moderate"
    description: "Prevent further access by initiating a device lock after a specified period of inactivity."
  - id: "AC-12"
    title: "Session Termination"
    family: "AC"
    baseline: "Moderate"
    description: "Automatically terminate a user session after a defined condition or period of inactivity."
  - id: "AC-14"
    title: "Permitted Actions without Identification or Authentication"
    family: "AC"
    baseline: "Moderate"
    description: "Identify and document user actions that are permitted without identification or authentication."
  - id: "AC-17"
    title: "Remote Access"
    family: "AC"
    baseline: "Moderate"
    description: "Authorize, monitor, and control all remote access to the system using encryption."
  - id: "AC-18"
    title: "Wireless Access"
    family: "AC"
    baseline: "Moderate"
    description: "Establish usage restrictions, configuration guidelines, and authentication for wireless access."
  - id: "AC-19"
    title: "Access Control for Mobile Devices"
    family: "AC"
    baseline: "Moderate"
    description: "Establish restrictions and implementation guidelines for organization-controlled and BYOD mobile devices."
  - id: "AC-20"
    title: "Use of External Systems"
    family: "AC"
    baseline: "Moderate"
    description: "Establish terms and conditions for authorized individuals to access the system from external systems."
  - id: "AC-22"
    title: "Publicly Accessible Content"
    family: "AC"
    baseline: "Moderate"
    description: "Designate and authorize individuals permitted to post information onto publicly accessible systems."

  # AT - Awareness and Training (4)
  - id: "AT-1"
    title: "Policy and Procedures"
    family: "AT"
    baseline: "Moderate"
    description: "Develop, document, and disseminate awareness and training policy and procedures."
  - id: "AT-2"
    title: "Literacy Training and Awareness"
    family: "AT"
    baseline: "Moderate"
    description: "Provide basic cybersecurity awareness training to system users as part of onboarding and annually."
  - id: "AT-3"
    title: "Role-Based Training"
    family: "AT"
    baseline: "Moderate"
    description: "Provide specialized role-based cybersecurity training to personnel with assigned security roles."
  - id: "AT-4"
    title: "Training Records"
    family: "AT"
    baseline: "Moderate"
    description: "Document and monitor information system security training activities, including individual attendance."

  # AU - Audit and Accountability (10)
  - id: "AU-1"
    title: "Policy and Procedures"
    family: "AU"
    baseline: "Moderate"
    description: "Develop, document, and disseminate audit and accountability policy and procedures."
  - id: "AU-2"
    title: "Event Logging"
    family: "AU"
    baseline: "Moderate"
    description: "Identify event types that the system must log to support auditing, monitoring, and forensic response."
  - id: "AU-3"
    title: "Content of Audit Records"
    family: "AU"
    baseline: "Moderate"
    description: "Ensure audit records contain information that establishes what event occurred, when, where, and by whom."
  - id: "AU-4"
    title: "Audit Log Storage Capacity"
    family: "AU"
    baseline: "Moderate"
    description: "Allocate audit log storage capacity and configure alerts for storage thresholds."
  - id: "AU-5"
    title: "Response to Audit Logging Failures"
    family: "AU"
    baseline: "Moderate"
    description: "Alert designated personnel and take protective action in the event of audit processing failure."
  - id: "AU-6"
    title: "Audit Record Review, Analysis, and Reporting"
    family: "AU"
    baseline: "Moderate"
    description: "Review and analyze system audit records regularly for indications of unusual or suspicious activity."
  - id: "AU-8"
    title: "Time Stamps"
    family: "AU"
    baseline: "Moderate"
    description: "Use internal system clocks synchronized with authoritative time sources to generate timestamps."
  - id: "AU-9"
    title: "Protection of Audit Information"
    family: "AU"
    baseline: "Moderate"
    description: "Protect audit information and tools from unauthorized access, modification, and deletion."
  - id: "AU-11"
    title: "Audit Record Retention"
    family: "AU"
    baseline: "Moderate"
    description: "Retain audit records for the specified retention schedule to support after-the-fact investigations."
  - id: "AU-12"
    title: "Audit Record Generation"
    family: "AU"
    baseline: "Moderate"
    description: "Provide audit record generation capability for auditable events defined in AU-2."

  # CA - Assessment, Authorization, and Monitoring (6)
  - id: "CA-1"
    title: "Policy and Procedures"
    family: "CA"
    baseline: "Moderate"
    description: "Develop, document, and disseminate assessment, authorization, and monitoring policy and procedures."
  - id: "CA-2"
    title: "Control Assessments"
    family: "CA"
    baseline: "Moderate"
    description: "Assess security and privacy controls to determine effectiveness and produce an assessment report."
  - id: "CA-3"
    title: "Information Exchange"
    family: "CA"
    baseline: "Moderate"
    description: "Approve and manage information exchange between systems using formal interconnect agreements."
  - id: "CA-5"
    title: "Plan of Action and Milestones"
    family: "CA"
    baseline: "Moderate"
    description: "Develop and update a plan of action and milestones (POAM) to document planned remediation."
  - id: "CA-7"
    title: "Continuous Monitoring"
    family: "CA"
    baseline: "Moderate"
    description: "Develop and implement a continuous monitoring strategy for system security controls."
  - id: "CA-9"
    title: "Internal System Connections"
    family: "CA"
    baseline: "Moderate"
    description: "Authorize internal connections of system components to the system."

  # CM - Configuration Management (11)
  - id: "CM-1"
    title: "Policy and Procedures"
    family: "CM"
    baseline: "Moderate"
    description: "Develop, document, and disseminate configuration management policy and procedures."
  - id: "CM-2"
    title: "Baseline Configuration"
    family: "CM"
    baseline: "Moderate"
    description: "Develop, document, and maintain under configuration control a current baseline configuration."
  - id: "CM-3"
    title: "Configuration Change Control"
    family: "CM"
    baseline: "Moderate"
    description: "Determine, document, approve, test, and audit proposed configuration changes to the system."
  - id: "CM-4"
    title: "Impact Analyses"
    family: "CM"
    baseline: "Moderate"
    description: "Analyze changes to the system to determine potential security and privacy impacts."
  - id: "CM-5"
    title: "Access Restrictions for Change"
    family: "CM"
    baseline: "Moderate"
    description: "Define, document, and enforce physical and logical access restrictions associated with system changes."
  - id: "CM-6"
    title: "Configuration Settings"
    family: "CM"
    baseline: "Moderate"
    description: "Establish and document mandatory configuration settings for IT products using security baselines."
  - id: "CM-7"
    title: "Least Functionality"
    family: "CM"
    baseline: "Moderate"
    description: "Configure systems to provide only essential capabilities and prohibit unused ports, services, and protocols."
  - id: "CM-8"
    title: "Information System Component Inventory"
    family: "CM"
    baseline: "Moderate"
    description: "Develop and document an inventory of system components that accurately reflects the system."
  - id: "CM-9"
    title: "Configuration Management Plan"
    family: "CM"
    baseline: "Moderate"
    description: "Develop and implement a configuration management plan that addresses roles, responsibilities, and processes."
  - id: "CM-10"
    title: "Software Usage Restrictions"
    family: "CM"
    baseline: "Moderate"
    description: "Use software in accordance with contract agreements and copyright laws; monitor peer-to-peer usage."
  - id: "CM-11"
    title: "User-Installed Software"
    family: "CM"
    baseline: "Moderate"
    description: "Establish policies governing the installation of software by users and enforce software execution policies."

  # CP - Contingency Planning (9)
  - id: "CP-1"
    title: "Policy and Procedures"
    family: "CP"
    baseline: "Moderate"
    description: "Develop, document, and disseminate contingency planning policy and procedures."
  - id: "CP-2"
    title: "Contingency Plan"
    family: "CP"
    baseline: "Moderate"
    description: "Develop a contingency plan for the system addressing critical missions, RTO/RPO, and recovery procedures."
  - id: "CP-3"
    title: "Contingency Training"
    family: "CP"
    baseline: "Moderate"
    description: "Provide contingency training to system users consistent with assigned roles and responsibilities."
  - id: "CP-4"
    title: "Contingency Plan Testing"
    family: "CP"
    baseline: "Moderate"
    description: "Test the contingency plan for the system at planned intervals to evaluate effectiveness."
  - id: "CP-6"
    title: "Alternate Storage Site"
    family: "CP"
    baseline: "Moderate"
    description: "Establish an alternate storage site including agreements to safeguard backup materials."
  - id: "CP-7"
    title: "Alternate Processing Site"
    family: "CP"
    baseline: "Moderate"
    description: "Establish an alternate processing site that permits resumption of operations within RTO."
  - id: "CP-8"
    title: "Telecommunications Services"
    family: "CP"
    baseline: "Moderate"
    description: "Establish alternate telecommunications services including diversity and redundancy."
  - id: "CP-9"
    title: "Information System Backup"
    family: "CP"
    baseline: "Moderate"
    description: "Conduct backups of user-level information, system-level information, and security software."
  - id: "CP-10"
    title: "Information System Recovery and Reconstitution"
    family: "CP"
    baseline: "Moderate"
    description: "Provide for the recovery and reconstitution of the system to a known state after a disruption."

  # IA - Identification and Authentication (9)
  - id: "IA-1"
    title: "Policy and Procedures"
    family: "IA"
    baseline: "Moderate"
    description: "Develop, document, and disseminate identification and authentication policy and procedures."
  - id: "IA-2"
    title: "Identification and Authentication (Organizational Users)"
    family: "IA"
    baseline: "Moderate"
    description: "Uniquely identify and authenticate organizational users (or processes acting on behalf of users)."
  - id: "IA-3"
    title: "Device Identification and Authentication"
    family: "IA"
    baseline: "Moderate"
    description: "Uniquely identify and authenticate devices before establishing a network connection."
  - id: "IA-4"
    title: "Identifier Management"
    family: "IA"
    baseline: "Moderate"
    description: "Manage individual identifiers by receiving authorization and preventing reuse."
  - id: "IA-5"
    title: "Authenticator Management"
    family: "IA"
    baseline: "Moderate"
    description: "Manage system authenticators including passwords, tokens, certificates, and biometrics."
  - id: "IA-6"
    title: "Authenticator Feedback"
    family: "IA"
    baseline: "Moderate"
    description: "Obscure feedback of authentication information during the authentication process."
  - id: "IA-7"
    title: "Cryptographic Module Authentication"
    family: "IA"
    baseline: "Moderate"
    description: "Implement mechanisms for authentication to cryptographic modules meeting applicable standards."
  - id: "IA-8"
    title: "Identification and Authentication (Non-Organizational Users)"
    family: "IA"
    baseline: "Moderate"
    description: "Uniquely identify and authenticate non-organizational users or external processes."
  - id: "IA-11"
    title: "Re-Authentication"
    family: "IA"
    baseline: "Moderate"
    description: "Require users to re-authenticate under specific conditions including session unlocks."

  # IR - Incident Response (8)
  - id: "IR-1"
    title: "Policy and Procedures"
    family: "IR"
    baseline: "Moderate"
    description: "Develop, document, and disseminate incident response policy and procedures."
  - id: "IR-2"
    title: "Incident Response Training"
    family: "IR"
    baseline: "Moderate"
    description: "Provide incident response training to system users consistent with assigned roles."
  - id: "IR-3"
    title: "Incident Response Testing"
    family: "IR"
    baseline: "Moderate"
    description: "Test incident response capability for the system at planned intervals using tabletop or functional drills."
  - id: "IR-4"
    title: "Incident Handling"
    family: "IR"
    baseline: "Moderate"
    description: "Implement an incident handling capability for incidents including preparation, detection, analysis, containment, eradication, and recovery."
  - id: "IR-5"
    title: "Incident Monitoring"
    family: "IR"
    baseline: "Moderate"
    description: "Track and document physical and cyber security incidents on an ongoing basis."
  - id: "IR-6"
    title: "Incident Reporting"
    family: "IR"
    baseline: "Moderate"
    description: "Require personnel to report suspected security incidents to the incident response team promptly."
  - id: "IR-7"
    title: "Incident Response Assistance"
    family: "IR"
    baseline: "Moderate"
    description: "Provide an incident response support resource that offers advice and assistance to users."
  - id: "IR-8"
    title: "Incident Response Plan"
    family: "IR"
    baseline: "Moderate"
    description: "Develop an incident response plan that provides the roadmap for implementing response capability."

  # MA - Maintenance (5)
  - id: "MA-1"
    title: "Policy and Procedures"
    family: "MA"
    baseline: "Moderate"
    description: "Develop, document, and disseminate system maintenance policy and procedures."
  - id: "MA-2"
    title: "Controlled Maintenance"
    family: "MA"
    baseline: "Moderate"
    description: "Schedule, perform, document, and review records of maintenance and repairs on system components."
  - id: "MA-3"
    title: "Maintenance Tools"
    family: "MA"
    baseline: "Moderate"
    description: "Approve, control, and monitor maintenance tools and verify their integrity."
  - id: "MA-4"
    title: "Nonlocal Maintenance"
    family: "MA"
    baseline: "Moderate"
    description: "Approve, monitor, and control nonlocal maintenance and diagnostic sessions."
  - id: "MA-5"
    title: "Maintenance Personnel"
    family: "MA"
    baseline: "Moderate"
    description: "Establish a process for authorizing maintenance personnel and supervise non-cleared personnel."

  # MP - Media Protection (7)
  - id: "MP-1"
    title: "Policy and Procedures"
    family: "MP"
    baseline: "Moderate"
    description: "Develop, document, and disseminate media protection policy and procedures."
  - id: "MP-2"
    title: "Media Access"
    family: "MP"
    baseline: "Moderate"
    description: "Restrict access to digital and non-digital media to authorized personnel."
  - id: "MP-3"
    title: "Media Marking"
    family: "MP"
    baseline: "Moderate"
    description: "Mark digital and non-digital media indicating the distribution limitations and handling caveats."
  - id: "MP-4"
    title: "Media Storage"
    family: "MP"
    baseline: "Moderate"
    description: "Physically control and securely store digital and non-digital media within secure areas."
  - id: "MP-5"
    title: "Media Transport"
    family: "MP"
    baseline: "Moderate"
    description: "Protect and control digital and non-digital media during transport outside controlled areas."
  - id: "MP-6"
    title: "Media Sanitization"
    family: "MP"
    baseline: "Moderate"
    description: "Sanitize digital and non-digital media prior to disposal or reuse in accordance with standards."
  - id: "MP-7"
    title: "Media Use"
    family: "MP"
    baseline: "Moderate"
    description: "Restrict the use of digital media types on system components using technical controls."

  # PE - Physical and Environmental Protection (16)
  - id: "PE-1"
    title: "Policy and Procedures"
    family: "PE"
    baseline: "Moderate"
    description: "Develop, document, and disseminate physical and environmental protection policy and procedures."
  - id: "PE-2"
    title: "Physical Access Authorizations"
    family: "PE"
    baseline: "Moderate"
    description: "Develop, approve, and maintain a list of individuals with authorized access to physical facilities."
  - id: "PE-3"
    title: "Physical Access Control"
    family: "PE"
    baseline: "Moderate"
    description: "Enforce physical access authorizations at entry points to facilities and sensitive areas."
  - id: "PE-4"
    title: "Access Control for Transmission"
    family: "PE"
    baseline: "Moderate"
    description: "Control physical access to information system distribution and transmission lines."
  - id: "PE-5"
    title: "Access Control for Output Devices"
    family: "PE"
    baseline: "Moderate"
    description: "Control physical access to information system output devices to prevent unauthorized viewing."
  - id: "PE-6"
    title: "Monitoring Physical Access"
    family: "PE"
    baseline: "Moderate"
    description: "Monitor physical access to the facility where the system resides using surveillance and sensors."
  - id: "PE-8"
    title: "Visitor Access Records"
    family: "PE"
    baseline: "Moderate"
    description: "Maintain visitor access records to facilities where the system resides."
  - id: "PE-10"
    title: "Emergency Shutoff"
    family: "PE"
    baseline: "Moderate"
    description: "Provide emergency shutoff capability for power to system components in secure facilities."
  - id: "PE-11"
    title: "Emergency Power"
    family: "PE"
    baseline: "Moderate"
    description: "Provide an uninterruptible power supply (UPS) and emergency generator to ensure continuous operation."
  - id: "PE-12"
    title: "Emergency Lighting"
    family: "PE"
    baseline: "Moderate"
    description: "Employ and maintain automatic emergency lighting for facility evacuation paths."
  - id: "PE-13"
    title: "Fire Protection"
    family: "PE"
    baseline: "Moderate"
    description: "Employ and maintain fire detection and suppression systems in facilities."
  - id: "PE-14"
    title: "Environmental Controls"
    family: "PE"
    baseline: "Moderate"
    description: "Maintain temperature and humidity levels within acceptable operating thresholds."
  - id: "PE-15"
    title: "Water Damage Protection"
    family: "PE"
    baseline: "Moderate"
    description: "Protect the system from damage resulting from water leakage and broken plumbing."
  - id: "PE-16"
    title: "Delivery and Removal"
    family: "PE"
    baseline: "Moderate"
    description: "Authorize, control, and log system components entering and exiting the facility."
  - id: "PE-17"
    title: "Alternate Work Site"
    family: "PE"
    baseline: "Moderate"
    description: "Assess security controls at alternate work sites (including telework/home offices)."
  - id: "PE-18"
    title: "Location of Information System Components"
    family: "PE"
    baseline: "Moderate"
    description: "Position system components within facilities to minimize unauthorized access and environmental hazards."

  # PL - Planning (6)
  - id: "PL-1"
    title: "Policy and Procedures"
    family: "PL"
    baseline: "Moderate"
    description: "Develop, document, and disseminate security planning policy and procedures."
  - id: "PL-2"
    title: "System Security and Privacy Plans"
    family: "PL"
    baseline: "Moderate"
    description: "Develop, document, and update a system security plan (SSP) describing operational controls."
  - id: "PL-4"
    title: "Rules of Behavior"
    family: "PL"
    baseline: "Moderate"
    description: "Establish and make readily available rules of behavior for individuals accessing the system."
  - id: "PL-8"
    title: "Security and Privacy Architectures"
    family: "PL"
    baseline: "Moderate"
    description: "Develop a security architecture for the system that describes security requirements and controls."
  - id: "PL-10"
    title: "Baseline Selection"
    family: "PL"
    baseline: "Moderate"
    description: "Select the appropriate security control baseline for the information system."
  - id: "PL-11"
    title: "Baseline Tailoring"
    family: "PL"
    baseline: "Moderate"
    description: "Tailor the selected security control baseline to align with organizational risk posture."

  # PM - Program Management (8)
  - id: "PM-1"
    title: "Information Security Program Plan"
    family: "PM"
    baseline: "Moderate"
    description: "Develop and disseminate an organization-wide information security program plan."
  - id: "PM-2"
    title: "Information Security Program Leadership"
    family: "PM"
    baseline: "Moderate"
    description: "Appoint a senior agency information security officer / CISO with mission authority."
  - id: "PM-3"
    title: "Information Security Resources"
    family: "PM"
    baseline: "Moderate"
    description: "Ensure information security resource requirements are integrated into capital planning."
  - id: "PM-4"
    title: "Plan of Action and Milestones Process"
    family: "PM"
    baseline: "Moderate"
    description: "Implement a process for developing and managing plans of action and milestones."
  - id: "PM-9"
    title: "Risk Management Strategy"
    family: "PM"
    baseline: "Moderate"
    description: "Develop an organization-wide risk management strategy that addresses risk tolerance."
  - id: "PM-12"
    title: "Insider Threat Program"
    family: "PM"
    baseline: "Moderate"
    description: "Implement an insider threat program that includes cross-discipline coordination."
  - id: "PM-14"
    title: "Testing, Training, and Monitoring"
    family: "PM"
    baseline: "Moderate"
    description: "Implement a process for ensuring testing, training, and monitoring activities are coordinated."
  - id: "PM-16"
    title: "Threat Awareness Program"
    family: "PM"
    baseline: "Moderate"
    description: "Implement a threat awareness program that includes cross-organization information sharing."

  # PS - Personnel Security (8)
  - id: "PS-1"
    title: "Policy and Procedures"
    family: "PS"
    baseline: "Moderate"
    description: "Develop, document, and disseminate personnel security policy and procedures."
  - id: "PS-2"
    title: "Position Risk Designation"
    family: "PS"
    baseline: "Moderate"
    description: "Assign a risk designation to all organizational positions and establish screening requirements."
  - id: "PS-3"
    title: "Personnel Screening"
    family: "PS"
    baseline: "Moderate"
    description: "Screen individuals prior to authorizing access to the system and rescreen periodically."
  - id: "PS-4"
    title: "Personnel Termination"
    family: "PS"
    baseline: "Moderate"
    description: "Disable system access and retrieve all organizational property upon termination of employment."
  - id: "PS-5"
    title: "Personnel Transfer"
    family: "PS"
    baseline: "Moderate"
    description: "Review and modify logical and physical access entitlements when an individual transfers."
  - id: "PS-6"
    title: "Access Agreements"
    family: "PS"
    baseline: "Moderate"
    description: "Require individuals to sign access agreements, such as NDAs, prior to being granted access."
  - id: "PS-7"
    title: "Third-Party Personnel Security"
    family: "PS"
    baseline: "Moderate"
    description: "Establish personnel security requirements for third-party providers and monitor compliance."
  - id: "PS-8"
    title: "Personnel Sanctions"
    family: "PS"
    baseline: "Moderate"
    description: "Employ a formal sanctions process for individuals failing to comply with security policies."

