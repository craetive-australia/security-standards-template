  # SC - System and Communications Protection (16)
  - id: "SC-1"
    title: "Policy and Procedures"
    family: "SC"
    baseline: "Moderate"
    description: "Develop, document, and disseminate system and communications protection policy and procedures."
  - id: "SC-2"
    title: "Separation of System and User Functionality"
    family: "SC"
    baseline: "Moderate"
    description: "Separate user functionality from system management functionality."
  - id: "SC-5"
    title: "Denial-of-Service Protection"
    family: "SC"
    baseline: "Moderate"
    description: "Protect against or limit the effects of denial-of-service attacks."
  - id: "SC-7"
    title: "Boundary Protection"
    family: "SC"
    baseline: "Moderate"
    description: "Monitor and control communications at external and key internal boundaries using firewalls."
  - id: "SC-8"
    title: "Transmission Confidentiality and Integrity"
    family: "SC"
    baseline: "Moderate"
    description: "Protect the confidentiality and integrity of transmitted information using cryptography."
  - id: "SC-10"
    title: "Network Disconnect"
    family: "SC"
    baseline: "Moderate"
    description: "Terminate network connections associated with communications sessions after a defined period."
  - id: "SC-12"
    title: "Cryptographic Key Establishment and Management"
    family: "SC"
    baseline: "Moderate"
    description: "Establish and manage cryptographic keys in accordance with applicable key management requirements."
  - id: "SC-13"
    title: "Cryptographic Protection"
    family: "SC"
    baseline: "Moderate"
    description: "Implement FIPS-validated or NSA-approved cryptographic modules where required."
  - id: "SC-15"
    title: "Collaborative Computing Devices"
    family: "SC"
    baseline: "Moderate"
    description: "Prohibit remote activation of collaborative computing devices (e.g., webcams, microphones)."
  - id: "SC-17"
    title: "Public Key Infrastructure Certificates"
    family: "SC"
    baseline: "Moderate"
    description: "Issue public key certificates or obtain certificates from an approved certificate authority."
  - id: "SC-18"
    title: "Mobile Code"
    family: "SC"
    baseline: "Moderate"
    description: "Define acceptable and unacceptable mobile code and control its execution."
  - id: "SC-20"
    title: "Secure Name/Address Resolution Service (Authoritative Source)"
    family: "SC"
    baseline: "Moderate"
    description: "Provide name resolution services that provide origin authentication and integrity (DNSSEC)."
  - id: "SC-21"
    title: "Secure Name/Address Resolution Service (Recursive or Caching Resolver)"
    family: "SC"
    baseline: "Moderate"
    description: "Perform recursive name resolution using resolvers that validate DNSSEC signatures."
  - id: "SC-22"
    title: "Architecture and Provisioning for Name/Address Resolution"
    family: "SC"
    baseline: "Moderate"
    description: "Ensure that internal name resolution systems are fault-tolerant and physically/logically segregated."
  - id: "SC-28"
    title: "Protection of Information at Rest"
    family: "SC"
    baseline: "Moderate"
    description: "Protect the confidentiality and integrity of information at rest using cryptographic mechanisms."
  - id: "SC-39"
    title: "Process Isolation"
    family: "SC"
    baseline: "Moderate"
    description: "Maintain a separate execution domain for each executing process."

  # SI - System and Information Integrity (11)
