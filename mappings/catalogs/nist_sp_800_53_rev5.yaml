    family: "SI"
    baseline: "Moderate"
    description: "Employ malicious code protection mechanisms at system entry and exit points and endpoints."
  - id: "SI-4"
    title: "System Monitoring"
    family: "SI"
    baseline: "Moderate"
    description: "Monitor the system to detect attacks, anomalous indicators, and unauthorized connections."
  - id: "SI-5"
    title: "Security Alerts, Advisories, and Directives"
    family: "SI"
    baseline: "Moderate"
    description: "Receive system security alerts, advisories, and directives; generate internal advisories as needed."
  - id: "SI-7"
    title: "Software, Firmware, and Information Integrity"
    family: "SI"
    baseline: "Moderate"
    description: "Employ integrity verification tools to detect unauthorized changes to software and firmware."
  - id: "SI-8"
    title: "Spam Protection"
    family: "SI"
    baseline: "Moderate"
    description: "Employ spam protection mechanisms at system entry and exit points."
  - id: "SI-10"
