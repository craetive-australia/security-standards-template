controls:
  # Principles & Lawfulness
  - id: "Art. 5"
    title: "Principles Relating to Processing of Personal Data"
    category: "principles"
    description: "Personal data shall be processed lawfully, fairly, and transparently, collected for specified purposes, minimized, accurate, retained only as long as necessary, and protected with integrity and confidentiality."
  - id: "Art. 6"
    title: "Lawfulness of Processing"
    category: "principles"
    description: "Processing shall be lawful only if at least one legal basis applies (consent, contract, legal obligation, vital interests, public interest, or legitimate interests)."
  - id: "Art. 7"
    title: "Conditions for Consent"
    category: "principles"
    description: "The controller must be able to demonstrate that the data subject consented; withdrawal of consent shall be as easy as giving consent."
  - id: "Art. 9"
    title: "Processing of Special Categories of Personal Data"
    category: "principles"
    description: "Processing of personal data revealing racial or ethnic origin, political opinions, religious beliefs, genetic or biometric data, health data, or sexual orientation is prohibited unless specific exceptions apply."

  # Data Subject Rights
  - id: "Art. 12"
    title: "Transparent Information, Communication, and Modalities"
    category: "rights"
    description: "The controller shall take appropriate measures to provide information in a concise, transparent, intelligible, and easily accessible form."
  - id: "Art. 13"
    title: "Information Provided Where Personal Data Are Collected"
    category: "rights"
    description: "Where personal data are collected directly from the data subject, the controller shall provide required privacy disclosures and contact details."
  - id: "Art. 14"
    title: "Information Provided Where Personal Data Not Obtained Directly"
    category: "rights"
    description: "Where personal data have not been obtained from the data subject, the controller shall provide identity, categories of data, and sources."
  - id: "Art. 15"
    title: "Right of Access by the Data Subject"
    category: "rights"
    description: "The data subject shall have the right to obtain confirmation as to whether personal data concerning them are being processed and access to that data."
  - id: "Art. 16"
    title: "Right to Rectification"
    category: "rights"
    description: "The data subject shall have the right to obtain rectification of inaccurate personal data without undue delay."
  - id: "Art. 17"
    title: "Right to Erasure ('Right to be Forgotten')"
    category: "rights"
    description: "The data subject shall have the right to obtain the erasure of personal data concerning them without undue delay under qualifying conditions."
  - id: "Art. 18"
    title: "Right to Restriction of Processing"
    category: "rights"
    description: "The data subject shall have the right to obtain restriction of processing under specified circumstances such as contested accuracy."
  - id: "Art. 20"
    title: "Right to Data Portability"
    category: "rights"
    description: "The data subject shall have the right to receive personal data concerning them in a structured, commonly used, and machine-readable format."
  - id: "Art. 21"
    title: "Right to Object"
    category: "rights"
    description: "The data subject shall have the right to object at any time to processing of personal data concerning them, including profiling."

  # Controller & Processor Obligations
  - id: "Art. 24"
    title: "Responsibility of the Controller"
    category: "obligations"
    description: "The controller shall implement appropriate technical and organizational measures to ensure and demonstrate processing is performed in accordance with GDPR."
  - id: "Art. 25"
    title: "Data Protection by Design and by Default"
    category: "obligations"
    description: "The controller shall implement appropriate technical and organizational measures designed to implement data protection principles effectively."
  - id: "Art. 28"
    title: "Processor Obligations and Contracts"
    category: "obligations"
    description: "Processing by a processor shall be governed by a binding contract or legal act setting out subject matter, duration, purpose, and obligations."
  - id: "Art. 30"
    title: "Records of Processing Activities (RoPA)"
    category: "obligations"
    description: "Each controller and processor shall maintain a detailed record of processing activities under its responsibility."
  - id: "Art. 35"
    title: "Data Protection Impact Assessment (DPIA)"
    category: "obligations"
    description: "Where processing is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall carry out a DPIA."
  - id: "Art. 37"
    title: "Designation of the Data Protection Officer (DPO)"
    category: "obligations"
    description: "The controller and processor shall designate a Data Protection Officer in specified cases, including large-scale processing or monitoring."
  - id: "Art. 39"
    title: "Tasks of the Data Protection Officer"
    category: "obligations"
    description: "The Data Protection Officer shall inform and advise the controller, monitor compliance with GDPR, provide advice regarding DPIAs, and cooperate with supervisory authorities."

  # Security of Processing
  - id: "Art. 32"
    title: "Security of Processing"
    category: "security"
    description: "The controller and processor shall implement appropriate technical and organizational measures to ensure a level of security appropriate to the risk, including encryption and resilience."

  # Breach Notification
  - id: "Art. 33"
    title: "Notification of Personal Data Breach to Supervisory Authority"
    category: "breach"
    description: "In the case of a personal data breach, the controller shall without undue delay and, where feasible, within 72 hours notify the competent supervisory authority."
  - id: "Art. 34"
    title: "Communication of Personal Data Breach to Data Subject"
    category: "breach"
    description: "When the personal data breach is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall communicate the breach to the data subject."

  # International Transfers
  - id: "Art. 44"
    title: "General Principle for Transfers"
    category: "transfers"
    description: "Any transfer of personal data to a third country or international organization shall take place only subject to compliance with Chapter V."
  - id: "Art. 45"
    title: "Transfers on the Basis of an Adequacy Decision"
    category: "transfers"
    description: "A transfer of personal data to a third country may take place where the Commission has decided that the third country ensures an adequate level of protection."
  - id: "Art. 46"
    title: "Transfers Subject to Appropriate Safeguards"
    category: "transfers"
    description: "A controller or processor may transfer personal data to a third country only if appropriate safeguards are provided, such as Standard Contractual Clauses (SCCs)."
