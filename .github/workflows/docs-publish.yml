name: Publish ISMS Documentation & OSCAL Portal

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs Portal & OSCAL v1.2.0 Artifacts
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export and Validate Deterministic OSCAL v1.2.0 Artifacts
        run: |
          python scripts/export_oscal.py --validate

      - name: Build MkDocs Documentation Site
        run: |
          mkdocs build --strict

      - name: Bundle OSCAL Artifacts into Static Site
        run: |
          mkdir -p site/oscal
          cp dist/oscal/*.json site/oscal/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
